<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FUHX System Verify</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="logo"><div class="bolt">⚡</div></div>
  <h1 class="brand">FU<span>HX</span></h1>
  <div class="sys">SYSTEM VERIFY</div>

  <div class="stage">
    <div class="loader" id="loader">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="core">⚡</div>
    </div>
    <div class="status pulse" id="status">Verifying…</div>

    <div class="result" id="result">
      <div class="icon" id="icon"></div>
      <div class="rtitle" id="rtitle"></div>
      <div class="rmsg" id="rmsg"></div>
      <button class="retry" id="retry" style="display:none">↻ Try Again</button>
    </div>
  </div>

  <div class="foot">FUHX © 2026</div>
</div>
<script src="/app.js"></script>
</body>
</html>
